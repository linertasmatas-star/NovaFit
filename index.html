<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaFit – demo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ===== BENDRAS STILIUS: tamsi tema su violetiniu švytėjimu =====
     Spalvas lengva keisti čia, viršuje (--accent = pagrindinė violetinė). */
  :root {
    --bg:#0b0912; --card:#121019; --card2:#1a1726; --ink:#f2f0fa; --muted:#9a94b3;
    --accent:#8b5cf6; --accent2:#6366f1; --glow:rgba(139,92,246,.45); --line:#26213a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,.22), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(99,102,241,.18), transparent 60%),
      var(--bg);
    min-height:100vh;
  }
  header { padding:18px 24px; display:flex; align-items:baseline; gap:12px; max-width:1140px; margin:0 auto; }
  header h1 {
    margin:0; font-family:"Space Grotesk", Manrope, sans-serif; font-size:24px; letter-spacing:.5px;
    background:linear-gradient(90deg,#c4b5fd,#8b5cf6 55%,#6366f1); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header span { color:var(--muted); font-size:13px; }
  header { align-items:center; }
  .logo { width:120px; height:auto; display:block; filter:drop-shadow(0 0 14px rgba(139,92,246,.35)); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  main { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr); gap:18px; padding:0 20px 24px; max-width:1140px; margin:0 auto; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } }
  .panel {
    background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line);
    border-radius:22px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.45);
  }
  h2 { font-family:"Space Grotesk", Manrope, sans-serif; font-weight:500; font-size:16px; margin:0 0 12px; }
  button { font:inherit; cursor:pointer; color:var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:#17142200; background-color:#161321; border-radius:999px; padding:6px 13px; font-size:13px; color:var(--muted); transition:.15s; }
  .chip:hover { color:var(--ink); border-color:#3a3257; }
  .chip.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent; box-shadow:0 0 18px var(--glow); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:10px; }
  .item { border:1px solid var(--line); background:#14111e; border-radius:16px; padding:7px; text-align:left; transition:.15s; }
  .item:hover { border-color:#3a3257; transform:translateY(-1px); }
  .item.worn { border-color:var(--accent); background:#1b1530; box-shadow:0 0 0 1px var(--accent), 0 0 22px var(--glow); }
  .item svg { width:100%; height:84px; display:block; border-radius:11px;
    background:radial-gradient(circle at 50% 40%, #4a3f73, #2a2342 80%); }
  .item b { display:block; font-size:13px; font-weight:600; margin-top:7px; }
  .item small { color:var(--muted); font-size:11px; }
  .stage { display:flex; justify-content:center; border-radius:18px; margin:4px 0 6px;
    background:radial-gradient(closest-side at 50% 55%, rgba(139,92,246,.30), rgba(99,102,241,.10) 55%, transparent 100%); }
  #avatar { width:100%; max-width:360px; height:auto; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .worn-list { list-style:none; padding:0; margin:10px 0 0; font-size:13px; }
  .worn-list li { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); color:var(--muted); }
  .worn-list li b { color:var(--ink); font-weight:600; }
  .worn-list button, .link { border:none; background:none; color:#a78bfa; font-size:12px; text-decoration:none; }
  .worn-list button:hover, .link:hover { color:#c4b5fd; text-decoration:underline; }
  .empty { color:var(--muted); font-size:13px; }
  .measure { display:grid; grid-template-columns:52px 1fr 64px 22px; align-items:center; gap:8px; font-size:13px; margin-bottom:10px; color:var(--muted); }
  .measure input[type=range] { width:100%; accent-color:var(--accent); }
  .measure input[type=number] { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#0f0d17; color:var(--ink); }
  .measure input[type=number]:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(139,92,246,.25); }
  .hint { color:var(--muted); font-size:12px; margin:0 0 8px; }
</style>
</head>
<body>

<header>
  <h1 class="sr">NovaFit</h1>
  <img class="logo" src="assets/logo.png" alt="NovaFit logotipas">
  <span>demo v2 – derinių kūrimas</span>
</header>

<main>
  <!-- KAIRĖ: drabužių katalogas -->
  <section class="panel">
    <h2>Katalogas</h2>
    <div class="chips" id="filters"></div>
    <div class="grid" id="catalog"></div>
  </section>

  <!-- DEŠINĖ: avataras ir dabartinis derinys -->
  <section class="panel">
    <h2>Tavo matmenys</h2>
    <div class="chips" id="genders"></div>
    <div class="measure">
      <span>Ūgis</span>
      <input type="range" id="heightRange" min="140" max="210" step="1">
      <input type="number" id="heightNum" min="140" max="210">
      <span>cm</span>
    </div>
    <div class="measure">
      <span>Svoris</span>
      <input type="range" id="weightRange" min="40" max="150" step="1">
      <input type="number" id="weightNum" min="40" max="150">
      <span>kg</span>
    </div>
    <p class="hint">Greitas pasirinkimas:</p>
    <div class="chips" id="shapes"></div>
    <p class="hint" id="bodyInfo"></p>
    <div class="stage"><canvas id="avatar" width="620" height="800"></canvas></div>
    <div class="row">
      <h2 style="margin:10px 0 0">Dabartinis derinys</h2>
      <button class="link" id="clearAll">Nurengti viską</button>
    </div>
    <ul class="worn-list" id="wornList"></ul>
  </section>
</main>

<script>
// =====================================================================
// 1. DUOMENYS – čia lengva pridėti ar pakeisti drabužius
// =====================================================================

// Kategorijos = vietos ant avataro. Kiekvienoje vietoje – vienas drabužis.
const CATEGORIES = {
  top:    "Viršus",
  bottom: "Apačia",
  shoes:  "Avalynė",
  outer:  "Striukės",
  hat:    "Aksesuarai"
};

// Drabužių katalogas. "type" nusako, kokia forma drabužis piešiamas.
const CATALOG = [
  { id:1,  name:"Balti marškinėliai",   category:"top",    type:"tshirt",   color:"#f4f4f4", style:"Kasdienis" },
  { id:2,  name:"Juodi marškinėliai",   category:"top",    type:"tshirt",   color:"#2b2b2b", style:"Kasdienis" },
  { id:3,  name:"Smėlinis megztinis",   category:"top",    type:"sweater",  color:"#d8c3a0", style:"Kasdienis" },
  { id:15, name:"Žalias džemperis",     category:"top",    type:"sweater",  color:"#6f8f5e", style:"Sportinis" },
  { id:4,  name:"Žydri marškiniai",     category:"top",    type:"shirt",    color:"#a9c8ea", style:"Elegantiškas" },
  { id:5,  name:"Klasikiniai džinsai",  category:"bottom", type:"pants",    color:"#3d5a80", style:"Kasdienis" },
  { id:6,  name:"Juodos kelnės",        category:"bottom", type:"pants",    color:"#262626", style:"Elegantiškas" },
  { id:7,  name:"Pilki šortai",         category:"bottom", type:"shorts",   color:"#9a9a9a", style:"Sportinis" },
  { id:8,  name:"Bordo sijonas",        category:"bottom", type:"skirt",    color:"#7a2335", style:"Elegantiškas" },
  { id:9,  name:"Balti sportbačiai",    category:"shoes",  type:"sneakers", color:"#ffffff", style:"Sportinis" },
  { id:10, name:"Rudi batai",           category:"shoes",  type:"boots",    color:"#6b4226", style:"Kasdienis" },
  { id:11, name:"Džinsinė striukė",     category:"outer",  type:"jacket",   color:"#5b7fa8", style:"Kasdienis" },
  { id:12, name:"Smėlinis paltas",      category:"outer",  type:"coat",     color:"#c19a6b", style:"Elegantiškas" },
  { id:13, name:"Juoda kepuraitė",      category:"hat",    type:"cap",      color:"#222222", style:"Sportinis" },
  { id:14, name:"Žalia kepurė",         category:"hat",    type:"beanie",   color:"#4f7a5a", style:"Kasdienis" }
];

// Kūno formos: s = pečiai, w = liemuo, h = klubai, a = rankų storis (pusė pločio)
const BODY_SHAPES = {
  slim:   { name:"Siaura",    s:32, w:24, h:27, a:13 },
  medium: { name:"Vidutinė",  s:37, w:30, h:33, a:15 },
  wide:   { name:"Platesnė",  s:43, w:40, h:43, a:18 }
};

// Atskaitos taškai: koks kūnas atitinka kokį svorio ir ūgio santykį (KMI).
// Tarp jų kūno matmenys apskaičiuojami tolygiai – todėl figūra keičiasi sklandžiai.
const BODY_ANCHORS = [
  [17,   BODY_SHAPES.slim],
  [22.5, BODY_SHAPES.medium],
  [30,   BODY_SHAPES.wide],
  [38,   { s:49, w:52, h:52, a:21 }]
];
// Greiti pasirinkimai: kokį KMI nustato kiekvienas mygtukas
const PRESET_BMI = { slim:18.5, medium:22.5, wide:29 };
const REF_HEIGHT = 175;   // tokio ūgio (cm) avataras nupieštas be mastelio

// Iš ūgio ir svorio apskaičiuoja kūno matmenis piešimui
function bodyFromMeasures(heightCm, weightKg) {
  const bmi = weightKg / ((heightCm / 100) ** 2);
  let i = 0;
  while (i < BODY_ANCHORS.length - 2 && bmi > BODY_ANCHORS[i + 1][0]) i++;
  const [b0, p0] = BODY_ANCHORS[i], [b1, p1] = BODY_ANCHORS[i + 1];
  const t = Math.min(1, Math.max(0, (bmi - b0) / (b1 - b0)));
  const body = { bmi };
  for (const k of ["s", "w", "h", "a"]) body[k] = p0[k] + (p1[k] - p0[k]) * t;
  return body;
}
function figureName(bmi) { return bmi < 20 ? "siaura" : bmi < 26 ? "vidutinė" : "platesnė"; }

// Kokia tvarka drabužiai piešiami (vėlesni – viršuje)
const LAYER_ORDER = ["bottom", "shoes", "top", "outer", "hat"];

// =====================================================================
// 2. BŪSENA – kas šiuo metu pasirinkta
// =====================================================================
const state = {
  gender: "female", // "female" arba "male"
  height: 170,      // ūgis, cm
  weight: 65,       // svoris, kg
  worn: {},         // pvz. { top: 3, bottom: 5 } – kategorija → drabužio id
  filter: "all"     // kuri katalogo kategorija rodoma
};

// =====================================================================
// 3. PIEŠIMAS – avataras ir drabužiai iš paprastų SVG formų
// =====================================================================
const CX = 100;            // avataro vidurio linija
const SKIN = "#e6cdb4";    // manekeno spalva

// Pagalbinė: pašviesina (+) arba patamsina (–) spalvą – kontūrams
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const ch = [n >> 16, (n >> 8) & 255, n & 255].map(v =>
    Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt));
  return `rgb(${ch.join(",")})`;
}
const pts = arr => arr.map(p => p.join(",")).join(" ");

// Rankos: nuo peties iki plaštakos
function arm(b, sign) {
  // plaštaka visada šiek tiek už klubų, kad ranka nelįstų į kūną
  const handX = Math.max(b.s + 10, b.h + b.a * 0.7);
  return { x1: CX + sign * (b.s - b.a / 2), y1: 102, x2: CX + sign * handX, y2: 236 };
}
// Taškas rankoje: t = 0 (petys) ... 1 (plaštaka)
function armPoint(b, sign, t) {
  const r = arm(b, sign);
  return [r.x1 + (r.x2 - r.x1) * t, r.y1 + (r.y2 - r.y1) * t];
}
// Rankovė arba ranka – stora linija su kontūru
function limb(b, sign, t, extra, color) {
  const r = arm(b, sign), [x2, y2] = armPoint(b, sign, t), wdt = b.a + extra;
  return `<line x1="${r.x1}" y1="${r.y1}" x2="${x2}" y2="${y2}" stroke="${shade(color, -0.25)}" stroke-width="${wdt + 3}" stroke-linecap="round"/>
          <line x1="${r.x1}" y1="${r.y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${wdt}" stroke-linecap="round"/>`;
}
// Liemens forma: pečiai → liemuo → klubai → (žemyn iki yBottom)
function torso(b, pad, yBottom, flare = 0.15) {
  const extra = Math.max(0, yBottom - 200) * flare;
  const L = [[CX - b.s - pad, 88], [CX - b.w - pad, 170], [CX - b.h - pad - extra, yBottom]];
  const R = L.map(([x, y]) => [2 * CX - x, y]).reverse();
  return pts([...L, ...R]);
}
// Koja (arba kelnių klešnė) nuo y1 iki y2; sign = -1 kairė, +1 dešinė
function leg(b, sign, y1, y2, pad = 0) {
  const ankle = 12 + b.h * 0.12;
  const at = y => {
    const t = (y - 200) / 160;
    const outer = (b.h + pad) + ((5 + ankle + pad) - (b.h + pad)) * t;
    const inner = Math.max(0, 5 * t - pad * 0.5);
    return [[CX + sign * inner, y], [CX + sign * outer, y]];
  };
  const [i1, o1] = at(y1), [i2, o2] = at(y2);
  return pts([i1, o1, o2, i2]);
}
function footX(b, sign) { return CX + sign * (5 + (12 + b.h * 0.12) / 2); }

// Plikas avataras (manekenas)
function drawBody(b) {
  const out = shade(SKIN, -0.18);
  return `
    <ellipse cx="100" cy="378" rx="${b.h + 22}" ry="7" fill="rgba(0,0,0,.08)"/>
    ${limb(b, -1, 1, 0, SKIN)} ${limb(b, 1, 1, 0, SKIN)}
    <polygon points="${leg(b, -1, 200, 360)}" fill="${SKIN}" stroke="${out}" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="${leg(b, 1, 200, 360)}" fill="${SKIN}" stroke="${out}" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="${footX(b, -1) - 3}" cy="364" rx="${9 + b.h * 0.08}" ry="6" fill="${SKIN}" stroke="${out}"/>
    <ellipse cx="${footX(b, 1) + 3}" cy="364" rx="${9 + b.h * 0.08}" ry="6" fill="${SKIN}" stroke="${out}"/>
    <polygon points="${torso(b, 0, 202)}" fill="${SKIN}" stroke="${out}" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="92" y="68" width="16" height="24" rx="4" fill="${SKIN}" stroke="${out}"/>
    <circle cx="100" cy="50" r="23" fill="${SKIN}" stroke="${out}" stroke-width="1.5"/>`;
}

// Vienas drabužis pagal jo tipą
function drawItem(item, b) {
  const c = item.color, k = shade(c, -0.28);
  const fill = `fill="${c}" stroke="${k}" stroke-width="1.5" stroke-linejoin="round"`;
  switch (item.type) {
    case "tshirt":
      return limb(b, -1, 0.33, 6, c) + limb(b, 1, 0.33, 6, c) +
        `<polygon points="${torso(b, 2, 208)}" ${fill}/>
         <path d="M90,88 Q100,98 110,88" fill="none" stroke="${k}" stroke-width="1.5"/>`;
    case "sweater":
      return limb(b, -1, 0.93, 6, c) + limb(b, 1, 0.93, 6, c) +
        `<polygon points="${torso(b, 3, 212)}" ${fill}/>
         <line x1="${CX - b.h - 4}" y1="205" x2="${CX + b.h + 4}" y2="205" stroke="${k}" stroke-width="1.5"/>
         <path d="M89,88 Q100,100 111,88" fill="none" stroke="${k}" stroke-width="3"/>`;
    case "shirt": {
      let buttons = "";
      for (let y = 105; y <= 195; y += 18) buttons += `<circle cx="100" cy="${y}" r="1.8" fill="${k}"/>`;
      return limb(b, -1, 0.92, 5, c) + limb(b, 1, 0.92, 5, c) +
        `<polygon points="${torso(b, 2, 208)}" ${fill}/>
         <line x1="100" y1="92" x2="100" y2="208" stroke="${k}" stroke-width="1"/>
         <polygon points="88,84 100,98 94,104" ${fill}/><polygon points="112,84 100,98 106,104" ${fill}/>${buttons}`;
    }
    case "pants": case "shorts": {
      const end = item.type === "pants" ? 356 : 262;
      return `<polygon points="${leg(b, -1, 196, end, 3)}" ${fill}/>
              <polygon points="${leg(b, 1, 196, end, 3)}" ${fill}/>
              <polygon points="${pts([[CX - b.w - 2, 168], [CX + b.w + 2, 168], [CX + b.h + 3, 200], [CX - b.h - 3, 200]])}" ${fill}/>
              <line x1="${CX - b.w - 2}" y1="175" x2="${CX + b.w + 2}" y2="175" stroke="${k}" stroke-width="1.2"/>`;
    }
    case "skirt":
      return `<polygon points="${pts([[CX - b.w - 2, 168], [CX + b.w + 2, 168], [CX + b.h + 16, 270], [CX - b.h - 16, 270]])}" ${fill}/>
              <line x1="${CX - b.w - 2}" y1="175" x2="${CX + b.w + 2}" y2="175" stroke="${k}" stroke-width="1.2"/>`;
    case "sneakers": case "boots": {
      let s = "";
      for (const sign of [-1, 1]) {
        if (item.type === "boots") s += `<polygon points="${leg(b, sign, 318, 362, 2)}" ${fill}/>`;
        s += `<ellipse cx="${footX(b, sign) + sign * 3}" cy="364" rx="${11 + b.h * 0.08}" ry="8" ${fill}/>
              <line x1="${footX(b, sign) + sign * 3 - 11 - b.h * 0.08}" y1="368" x2="${footX(b, sign) + sign * 3 + 11 + b.h * 0.08}" y2="368" stroke="${item.type === "sneakers" ? "#bbb" : k}" stroke-width="3"/>`;
      }
      return s;
    }
    case "jacket": case "coat": {
      const end = item.type === "jacket" ? 214 : 292;
      const half = sign => {
        const outer = [[CX + sign * (b.s + 5), 86], [CX + sign * (b.w + 5), 170], [CX + sign * (b.h + 6 + Math.max(0, end - 200) * 0.18), end]];
        return pts([[CX + sign * 3, 92], ...outer, [CX + sign * 3, end]]);
      };
      return limb(b, -1, 0.95, 9, c) + limb(b, 1, 0.95, 9, c) +
        `<polygon points="${half(-1)}" ${fill}/><polygon points="${half(1)}" ${fill}/>
         <polygon points="86,86 100,96 92,130" fill="${shade(c, -0.12)}" stroke="${k}" stroke-width="1.2"/>
         <polygon points="114,86 100,96 108,130" fill="${shade(c, -0.12)}" stroke="${k}" stroke-width="1.2"/>`;
    }
    case "cap":
      return `<path d="M76,46 A24,24 0 0 1 124,46 Z" ${fill}/>
              <path d="M110,44 Q132,42 140,48 L112,49 Z" ${fill}/>`;
    case "beanie":
      return `<path d="M76,46 A24,27 0 0 1 124,46 Z" ${fill}/>
              <rect x="74" y="40" width="52" height="10" rx="4" fill="${shade(c, -0.1)}" stroke="${k}" stroke-width="1.5"/>
              <circle cx="100" cy="20" r="6" ${fill}/>`;
  }
  return "";
}

// Mažos peržiūros kataloge: kurią avataro dalį rodyti
const THUMB_VIEW = {
  top: "35 78 130 168", bottom: "45 160 110 205", shoes: "52 305 96 75",
  outer: "28 78 144 222", hat: "68 10 78 46"
};

// =====================================================================
// 4. EKRANO ATNAUJINIMAS – kiekviena dalis piešiama iš "state"
// =====================================================================
const $ = id => document.getElementById(id);
const byId = id => CATALOG.find(i => i.id === id);

function renderFilters() {
  const all = { all: "Visi", ...CATEGORIES };
  $("filters").innerHTML = Object.entries(all).map(([key, name]) =>
    `<button class="chip ${state.filter === key ? "active" : ""}" data-filter="${key}">${name}</button>`).join("");
}

function renderCatalog() {
  const b = BODY_SHAPES.medium;
  const items = CATALOG.filter(i => state.filter === "all" || i.category === state.filter);
  $("catalog").innerHTML = items.map(i => `
    <button class="item ${state.worn[i.category] === i.id ? "worn" : ""}" data-item="${i.id}">
      <svg viewBox="${THUMB_VIEW[i.category]}">${drawItem(i, b)}</svg>
      <b>${i.name}</b><small>${CATEGORIES[i.category]} · ${i.style}</small>
    </button>`).join("");
}

function renderShapes() {
  $("shapes").innerHTML = Object.entries(BODY_SHAPES).map(([key, s]) =>
    `<button class="chip" data-shape="${key}">${s.name}</button>`).join("");
}

// Ūgio ir svorio laukeliai rodo tą patį skaičių kaip ir būsena
function renderMeasures() {
  $("heightRange").value = $("heightNum").value = state.height;
  $("weightRange").value = $("weightNum").value = state.weight;
}

function renderGenders() {
  const g = { female: "Moteris", male: "Vyras" };
  $("genders").innerHTML = Object.entries(g).map(([key, name]) =>
    `<button class="chip ${state.gender === key ? "active" : ""}" data-gender="${key}">${name}</button>`).join("");
}

// =====================================================================
// AVATARAS IŠ MAKEHUMAN FIGŪRŲ
// Paveikslėliai yra aplanke assets/avatar/<figūra>/ : body.png ir po vieną
// failą kiekvienam drabužio tipui. Drabužiai pilki – spalvą uždedam čia.
// =====================================================================
const FIG = {
  imgW: 468, imgH: 648, footY: 642,                 // paveikslėlio dydis ir pėdų linija
  pxPerCm: 3.6,                                      // 36 taškai = 10 cm
  naturalCm: { female: 159, male: 173 },             // kokio ūgio figūra nupiešta
  levelBmi: [17.5, 20, 22.5, 26.5, 31]               // svorio lygiai w0..w4 ≈ šie KMI
};
function figureId() {
  const bmi = state.weight / ((state.height / 100) ** 2);
  let best = 0;
  FIG.levelBmi.forEach((v, i) => { if (Math.abs(v - bmi) < Math.abs(FIG.levelBmi[best] - bmi)) best = i; });
  return `${state.gender}-w${best}`;
}

// Paveikslėlių įkėlimas (kiekvienas įkeliamas tik vieną kartą)
const imgCache = {};
function loadImg(src) {
  if (!imgCache[src]) imgCache[src] = new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => fail(new Error("Nepavyko įkelti " + src));
    im.src = src;
  });
  return imgCache[src];
}

// Pilką drabužio sluoksnį nuspalvinam: pilka × spalva (šešėliai išlieka)
const colorCache = {};
async function coloredLayer(fig, type, color) {
  const key = `${fig}/${type}/${color}`;
  if (!colorCache[key]) {
    const im = await loadImg(`assets/avatar/${fig}/${type}.png`);
    const c = document.createElement("canvas");
    c.width = im.width; c.height = im.height;
    const x = c.getContext("2d");
    x.drawImage(im, 0, 0);
    x.globalCompositeOperation = "multiply";
    x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = "destination-in";   // paliekam tik drabužio formą
    x.drawImage(im, 0, 0);
    colorCache[key] = c;
  }
  return colorCache[key];
}

let renderToken = 0;
async function renderAvatar() {
  const token = ++renderToken;
  const b = bodyFromMeasures(state.height, state.weight);
  $("bodyInfo").textContent = `Figūra: ${figureName(b.bmi)}`;
  const fig = figureId();
  try {
    const body = await loadImg(`assets/avatar/${fig}/body.png`);
    const layers = [];
    for (const cat of LAYER_ORDER) {
      const item = state.worn[cat] && byId(state.worn[cat]);
      if (item) layers.push(await coloredLayer(fig, item.type, item.color));
    }
    if (token !== renderToken) return;   // kol krovėm, vartotojas jau pakeitė kažką kita
    const cv = $("avatar"), ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);
    // Mastelis: aukštesnis žmogus = didesnė figūra. Pėdos visada toje pačioje vietoje.
    const k = state.height / FIG.naturalCm[state.gender];
    const groundY = cv.height - 20;
    ctx.save();
    ctx.translate(cv.width / 2, groundY);
    ctx.scale(k, k);
    ctx.translate(-FIG.imgW / 2, -FIG.footY);
    ctx.fillStyle = "rgba(139,92,246,.28)";
    ctx.beginPath(); ctx.ellipse(FIG.imgW / 2, FIG.footY - 2, 120, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(body, 0, 0);
    for (const l of layers) ctx.drawImage(l, 0, 0);
    ctx.restore();
    // Ūgio linija
    const headY = groundY - state.height * FIG.pxPerCm;
    ctx.strokeStyle = "rgba(167,139,250,.6)"; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(10, headY); ctx.lineTo(140, headY); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#a78bfa"; ctx.font = "22px Manrope, system-ui, sans-serif";
    ctx.fillText(`${state.height} cm`, 10, headY - 8);
  } catch (err) {
    $("bodyInfo").textContent = "Nepavyko įkelti avataro paveikslėlių (aplankas assets/avatar turi būti šalia index.html).";
    console.error(err);
  }
}

function renderWornList() {
  const cats = Object.keys(CATEGORIES).filter(c => state.worn[c]);
  $("wornList").innerHTML = cats.length
    ? cats.map(c => `<li><span>${CATEGORIES[c]}: <b>${byId(state.worn[c]).name}</b></span>
                     <button data-remove="${c}">nuimti</button></li>`).join("")
    : `<li class="empty">Paspausk drabužį kataloge, kad jį apvilktum.</li>`;
}

function render() {
  renderFilters(); renderCatalog(); renderGenders(); renderShapes(); renderMeasures(); renderAvatar(); renderWornList();
}

// Ūgio/svorio keitimas: slankiklis ir skaičiaus laukelis veikia kartu
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
function onMeasure(field, min, max, el) {
  const v = Number(el.value);
  if (!v) return;                       // laukelis tuščias – laukiam, kol įves
  state[field] = clamp(Math.round(v), min, max);
  // Atnaujinam kitą laukelį, bet ne tą, į kurį žmogus dabar rašo
  const other = el.type === "range" ? field + "Num" : field + "Range";
  $(other).value = state[field];
  renderAvatar();
}
$("heightRange").addEventListener("input", e => onMeasure("height", 140, 210, e.target));
$("heightNum").addEventListener("input",   e => onMeasure("height", 140, 210, e.target));
$("weightRange").addEventListener("input", e => onMeasure("weight", 40, 150, e.target));
$("weightNum").addEventListener("input",   e => onMeasure("weight", 40, 150, e.target));
// Išėjus iš laukelio – parodom pataisytą skaičių (pvz. 300 → 210)
["heightNum", "weightNum"].forEach(id => $(id).addEventListener("change", renderMeasures));

// =====================================================================
// 5. PASPAUDIMAI – kas vyksta, kai vartotojas ką nors spaudžia
// =====================================================================
document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) return;
  const d = el.dataset;
  if (d.filter) state.filter = d.filter;
  if (d.gender) state.gender = d.gender;
  // Greitas pasirinkimas: pagal dabartinį ūgį nustatom tipišką svorį
  if (d.shape) state.weight = clamp(Math.round(PRESET_BMI[d.shape] * (state.height / 100) ** 2), 40, 150);
  if (d.item) {
    const item = byId(Number(d.item));
    // Paspaudus jau apvilktą drabužį – nuimam, kitaip – uždedam (pakeičiam seną)
    if (state.worn[item.category] === item.id) delete state.worn[item.category];
    else state.worn[item.category] = item.id;
  }
  if (d.remove) delete state.worn[d.remove];
  if (el.id === "clearAll") state.worn = {};
  render();
});

render();
</script>
</body>
</html>
