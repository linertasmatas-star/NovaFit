<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaFit – 3D avataro bandymas</title>
<!-- Tik kūrėjams: patikrinti assets/avatar3d.js su įvairiais matmenimis ir drabužiais. -->
<style>
  body { margin:0; background:#16151B; color:#F4F3F7; font:14px Manrope, system-ui, sans-serif; }
  #view { width:100vw; height:68vh; display:block; background:#ECEAF2; }
  .panel { padding:12px 16px; display:grid; grid-template-columns:110px 1fr 56px; gap:6px 10px; align-items:center; max-width:560px; }
  input[type=range] { width:100%; accent-color:#7C3AED; }
  .types { padding:0 16px 16px; display:flex; flex-wrap:wrap; gap:6px; }
  .types label { background:#2A2933; padding:6px 10px; border-radius:999px; }
</style>
<script type="importmap">{ "imports": { "three": "../assets/lib/three/three.module.js", "three/addons/": "../assets/lib/three/addons/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel" id="panel"></div>
<div class="types" id="types"></div>
<script type="module">
import { createAvatar3D } from "../assets/avatar3d.js";
const av = await createAvatar3D(document.getElementById("view"), { keepBuffer: true });
const body = { gender: "female", height: 170, weight: 65, waist: 72, hips: 96, arm: 60 };
const R = { height: [140, 210], weight: [40, 150], waist: [50, 140], hips: [70, 150], arm: [45, 80] };
const panel = document.getElementById("panel");
panel.insertAdjacentHTML("beforeend", `<span>lytis</span><select id="g"><option value="female">moteris</option><option value="male">vyras</option></select><span></span>`);
for (const [k, [a, b]] of Object.entries(R))
  panel.insertAdjacentHTML("beforeend", `<span>${k}</span><input type="range" min="${a}" max="${b}" value="${body[k]}" data-k="${k}"><output id="o-${k}">${body[k]}</output>`);
panel.addEventListener("input", e => {
  const k = e.target.dataset.k;
  if (k) { body[k] = +e.target.value; document.getElementById("o-" + k).textContent = body[k]; }
  else body.gender = e.target.value;
  av.setBody(body);
});
const COLORS = { tshirt:"#f4f4f4", oversize:"#2b2b2b", sweater:"#d8c3a0", shirt:"#a9c8ea", pants:"#3d5a80", widepants:"#5b7fa8", shorts:"#9a9a9a",
  skirt:"#7a2335", sneakers:"#ffffff", boots:"#6b4226", jacket:"#5b7fa8", coat:"#c19a6b", cap:"#222222", beanie:"#4f7a5a" };
let outfit = ["tshirt", "pants", "sneakers"];
const types = document.getElementById("types");
for (const t of Object.keys(COLORS))
  types.insertAdjacentHTML("beforeend", `<label><input type="checkbox" value="${t}" ${outfit.includes(t) ? "checked" : ""}> ${t}</label>`);
const apply = () => av.setOutfit(outfit.map(t => ({ type: t, color: COLORS[t] })));
types.addEventListener("change", () => { outfit = [...types.querySelectorAll("input:checked")].map(i => i.value); apply(); });
av.setBody(body); apply();
window.__test = (b, o) => { Object.assign(body, b); av.setBody(body); outfit = o; apply(); av.render(); };
window.__ready = true;
</script>
</body>
</html>
